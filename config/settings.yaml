# ===================================================================
# Industrial IoT Sensor Analytics Platform - central configuration
# ===================================================================
# Every tunable value lives here, so nothing is hard-coded in the code.
# Paths are relative to the project root.

# -------------------------------------------------------------------
# Data paths for each layer of the medallion architecture
# -------------------------------------------------------------------
paths:
  raw: data/raw
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  models: models
  reports: reports
  logs: logs

# -------------------------------------------------------------------
# Source dataset: Microsoft Azure Predictive Maintenance (Kaggle)
# -------------------------------------------------------------------
dataset:
  kaggle_slug: arnabbiswas1/microsoft-azure-predictive-maintenance
  files:
    telemetry: PdM_telemetry.csv
    errors: PdM_errors.csv
    maintenance: PdM_maint.csv
    failures: PdM_failures.csv
    machines: PdM_machines.csv

# -------------------------------------------------------------------
# Sensor validation limits (used by the Silver layer)
# Readings outside [min, max] are treated as sensor glitches -> null.
# The source dataset does not state units; limits are set well
# outside the normal operating range observed in the data.
# -------------------------------------------------------------------
sensors:
  volt:      { min: 0.0, max: 300.0 }
  rotate:    { min: 0.0, max: 1000.0 }
  pressure:  { min: 0.0, max: 250.0 }
  vibration: { min: 0.0, max: 100.0 }

# -------------------------------------------------------------------
# Data-quality injection (Phase 2)
# The source data is very clean, so these problems are added to a
# COPY of the raw telemetry to give the Silver layer real work.
# Rates are fractions of rows/values (0.01 = 1%).
# -------------------------------------------------------------------
data_quality_injection:
  seed: 42
  missing_rate: 0.01      # values set to empty
  spike_rate: 0.002       # values replaced by impossible readings
  duplicate_rate: 0.005   # rows duplicated (e.g. gateway retries)
  # Stuck sensor: a sensor keeps repeating its last value for several hours.
  stuck_episodes: 200     # number of stuck-sensor episodes across all machines
  stuck_min_hours: 3      # shortest episode (hours of identical readings)
  stuck_max_hours: 12     # longest episode

# -------------------------------------------------------------------
# Silver layer cleaning rules (Phase 4)
# -------------------------------------------------------------------
silver:
  stuck_min_run: 3           # this many identical consecutive hourly readings = stuck sensor
  max_fill_hours: 3          # fill gaps up to this length; longer gaps stay missing
  fill_window_hours: 24      # fill value = mean of valid readings in this window around the gap

# -------------------------------------------------------------------
# Gold layer features (Phase 5)
# -------------------------------------------------------------------
gold:
  feature_step_hours: 3        # one feature row per machine every N hours
  window_hours: [3, 24]        # rolling windows (looking back only) for sensor features

# -------------------------------------------------------------------
# Business assumptions (used by the business-insights layer)
# Illustrative values - replace with real plant figures if available.
# -------------------------------------------------------------------
business:
  currency: INR
  downtime_cost_per_hour: 50000          # lost production per machine-hour
  # Unplanned repairs cost more than planned ones: rush parts, overtime labour.
  emergency_repair_premium: 1.5          # unplanned repair cost = repair_cost x 1.5
  components:                            # per component: parts + labour, and downtime
    comp1: { repair_cost: 40000, unplanned_downtime_hours: 8,  planned_downtime_hours: 2 }
    comp2: { repair_cost: 60000, unplanned_downtime_hours: 10, planned_downtime_hours: 3 }
    comp3: { repair_cost: 35000, unplanned_downtime_hours: 6,  planned_downtime_hours: 2 }
    comp4: { repair_cost: 75000, unplanned_downtime_hours: 12, planned_downtime_hours: 3 }

# -------------------------------------------------------------------
# Plant layout (business reference data, Phase 2)
# The source dataset has no plant structure, so machines are assigned
# to plants / production lines here. Assignment is random but fixed by
# the seed, and machines are split evenly across all lines.
# -------------------------------------------------------------------
plant_layout:
  seed: 42
  plants:
    - plant_id: PUNE
      name: Pune Plant
      city: Pune
      lines: 3
    - plant_id: CHENNAI
      name: Chennai Plant
      city: Chennai
      lines: 2

# -------------------------------------------------------------------
# Machine-learning settings
# -------------------------------------------------------------------
ml:
  prediction_horizon_hours: 24   # predict "will it fail within N hours?"
  train_end_date: "2015-10-01"   # time-based split: train before, test after
  random_seed: 42

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging:
  level: INFO              # DEBUG | INFO | WARNING | ERROR | CRITICAL
  file_name: pipeline.log  # written inside paths.logs
